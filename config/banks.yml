# Configuration for bank file parsing and schema mapping

# data folder where bank files are located
data_folder: "data"

banks:
  ubs:
    name: UBS
    # File discovery: how to find the file(s) to load
    files:
      pattern: "ubs_{period_start}_{period_end}.csv"
      period_date_format: "%Y%m%d"
    
    # CSV parsing options: how to read the file(s)
    read_options:
      delimiter: ";"
      quotechar: "\""
      encoding: "UTF-8"
      skiplines: 0
    
    # Source schema: the expected columns in the CSV file
    columns:
      - name: "Trade date"
        required: True
      - name: "Trade time"
        required: False
      - name: "Booking date"
        required: False
      - name: "Value date"
        required: False
      - name: "Currency"
        required: True
      - name: "Debit"
        required: True
      - name: "Credit"
        required: True
      - name: "Individual amount"
        required: False
      - name: "Balance"
        required: False
      - name: "Transaction no."
        required: True
      - name: "Description1"
        required: True
      - name: "Description2"
        required: False
      - name: "Description3"
        required: False
      - name: "Footnotes"
        required: False