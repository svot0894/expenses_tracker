# Configuration for bank file parsing and schema mapping

# data folder where bank files are located
data_folder: "data"

banks:
  ubs:
    name: UBS
    bronze:
      # File discovery: how to find the file(s) to load
      files:
        pattern: "ubs_{period_start}_{period_end}.csv"
        period_date_format: "%Y%m%d"
      
      # CSV parsing options: how to read the file(s)
      read_options:
        delimiter: ";"
        quotechar: "\""
        encoding: "UTF-8"
        skiplines: 0
      
      # Source schema: the expected columns in the CSV file
      columns:
        - name: "Trade date"
          required: True
        - name: "Trade time"
          required: False
        - name: "Booking date"
          required: False
        - name: "Value date"
          required: False
        - name: "Currency"
          required: True
        - name: "Debit"
          required: True
        - name: "Credit"
          required: True
        - name: "Individual amount"
          required: False
        - name: "Balance"
          required: False
        - name: "Transaction no."
          required: True
        - name: "Description1"
          required: True
        - name: "Description2"
          required: False
        - name: "Description3"
          required: False
        - name: "Footnotes"
          required: False
    silver:
      # Renamed columns to match the expected schema
      mappings:
        transaction_id: "Transaction no."
        transaction_date: "Trade date"
        # amount for UBS is derived
        currency: "Currency"
        description: "Description1"
      
      # Transformation rules for UBS bank data
      transformations:
        - column: transaction_id
          operation: trim_text
        
        - column: transaction_date
          operation: parse_date
          date_format: "%Y-%m-%d"
        
        - column: amount
          operation: combine_columns
          columns: ["Debit", "Credit"]
        
        - column: amount
          operation: parse_decimal
          precision: 18
          scale: 2
        
        - column: currency
          operation: trim_text
        
        - column: description
          operation: trim_text
      
      # Validation rules for UBS bank data
      validations:
        - column: transaction_id
          operation: not_null

        - column: transaction_date
          operation: not_null

        - column: amount
          operation: not_null
          
        - column: currency
          operation: not_null
  bcf:
    name: BCF
    bronze:
      # File discovery: how to find the file(s) to load
      files:
        pattern: "bcf_{period_start}_{period_end}.csv"
        period_date_format: "%Y%m%d"
      
      # CSV parsing options: how to read the file(s)
      read_options:
        delimiter: ","
        quotechar: "\""
        encoding: "UTF-8"
        skiplines: 0
      
      # Source schema: the expected columns in the CSV file
      columns:
        - name: "Date"
          required: True
        - name: "Bénéficiaire"
          required: True
        - name: "Montant"
          required: True
        - name: "Devise"
          required: True
        - name: "Compte"
          required: True
        - name: "Catégorie"
          required: False
        - name: "Titulaire du compte"
          required: False
        - name: "Référence" # appears twice
          required: False
        - name: "Informations de paiement"
          required: False
        - name: "Commentaire"
          required: False
        - name: "Mots clés"
          required: False
    silver:
      # Renamed columns to match the expected schema
      mappings:
        # transaction_id is derived
        transaction_date: "Date"
        amount: "Montant"
        currency: "Devise"
        account: "Compte"
        description: "Bénéficiaire"
      
      # Transformation rules for BCF bank data
      transformations:
        - column: transaction_id
          operation: generate_id

        - column: transaction_date
          operation: parse_date
          date_format: "%m/%d/%Y"

        - column: amount
          operation: normalize_numbers
        
        - column: amount
          operation: parse_decimal
          precision: 18
          scale: 2
        
        - column: account
          operation: trim_text
        
        - column: currency
          operation: trim_text
        
        - column: description
          operation: trim_text
      
      # Validation rules for BCF bank data
      validations:
        - column: transaction_id
          operation: not_null

        - column: transaction_date
          operation: not_null
        
        - column: account
          operation: not_null

        - column: amount
          operation: not_null
          
        - column: currency
          operation: not_null
  swc:
    name: SWISSCARD
    bronze:
      files:
        pattern: "swc_{period_start}_{period_end}.csv"
        period_date_format: "%Y%m%d"
      read_options:
        delimiter: ","
        quotechar: "\""
        encoding: "UTF-8"
        skiplines: 0
      columns:
        - name: "Transaction date"
          required: True
        - name: "Description"
          required: True
        - name: "Merchant"
          required: True
        - name: "Card number"
          required: False
        - name: "Currency"
          required: True
        - name: "Amount"
          required: True
        - name: "Foreign Currency"
          required: True
        - name: "Amount in foreign currency"
          required: True
        - name: "Debit/Credit"
          required: True
        - name: "Status"
          required: False
        - name: "Merchant Category"
          required: False
        - name: "Registered Category"
          required: False
    silver:
      # Renamed columns to match the expected schema
      mappings:
        # transaction_id is derived
        transaction_date: "Transaction date"
        # amount for SWC is derived
        # currency for SWC is derived
        description: "Description"
      
      transformations:
        - column: transaction_id
          operation: generate_id
        
        - column: transaction_date
          operation: parse_date
          date_format: "%d.%m.%Y"
        
        - column: amount
          operation: combine_columns
          columns: ["Amount", "Amount in foreign currency"]
        
        - column: amount
          operation: parse_decimal
          precision: 18
          scale: 2
        
        - column: currency
          operation: combine_columns
          columns: ["Currency", "Foreign Currency"]
        
        - column: currency
          operation: trim_text
        
        - column: description
          operation: trim_text
      
      validations:
        - column: transaction_id
          operation: not_null

        - column: transaction_date
          operation: not_null

        - column: amount
          operation: not_null
          
        - column: currency
          operation: not_null